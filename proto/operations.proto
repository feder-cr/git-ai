// UserLandRequest is a request for the UserLand RPC.
message UserLandRequest {
  // Strategy selects how a change that is not a fast-forward is landed.
  enum Strategy {
    // STRATEGY_REBASE_UNSPECIFIED rebases the change onto the current tip
    // (default), producing linear history.
    STRATEGY_REBASE_UNSPECIFIED = 0;
    // STRATEGY_MERGE creates a merge commit with parents [tip, commit_id].
    STRATEGY_MERGE = 1;
    // STRATEGY_FF_ONLY only fast-forwards; otherwise the RPC fails with
    // not_ancestor.
    STRATEGY_FF_ONLY = 2;
  }

  // repository is the repository to land in.
  Repository repository = 1 [(target_repository)=true];
  // user to execute the action as. Used as committer of rewritten commits and
  // for authorization by hooks.
  User user = 2;
  // branch is the branch name to land on (e.g. "main", not "refs/heads/main").
