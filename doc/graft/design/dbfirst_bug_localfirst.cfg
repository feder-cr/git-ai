\* git writes the local reference before the database commit. Expected:
\* LocalNotAhead violated.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2", "w3", "w4"}
    Kind <- KindS1
    Target <- TargetS1
    Land <- LandS1
    Init0 <- InitS1
    DBFirst = FALSE
    GuardCAS = TRUE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = TRUE
    GuardDBBeforeLocal = FALSE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
