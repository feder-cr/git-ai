\* DB-first without the generalized refusal of rejected push updates.
\* Expected: NoPhantom violated (a push update git rejected is committed to
\* the database), reachable on one node because DB-first commits are not in
\* the local copy until the applier runs.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2", "w3", "w4"}
    Kind <- KindS1
    Target <- TargetS1
    Land <- LandS1
    Init0 <- InitS1
    DBFirst = TRUE
    GuardCAS = TRUE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = FALSE
    GuardDBBeforeLocal = TRUE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
