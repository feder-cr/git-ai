\* The design on main (0fccd7c): rpc writers on the hook path, the 02fbb52
\* stop-gap on, no generalized refusal of rejected updates. Scenario S1, one
\* node plus another node writing b2. Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2", "w3", "w4"}
    Kind <- KindS1
    Target <- TargetS1
    Land <- LandS1
    Init0 <- InitS1
    DBFirst = FALSE
    GuardCAS = TRUE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = FALSE
    GuardDBBeforeLocal = TRUE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
PROPERTIES
    EventuallyConsistent
