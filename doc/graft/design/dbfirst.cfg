\* The proposed design: rpc writers DB-first, every guard on, including the
\* generalized refusal of rejected push updates (GuardStaleUpdate, stage 1 of
\* dbfirst-writes.md). Scenario S1: two rpc writers land the same change on
\* b1 (a client retry), a non-atomic push on b1, another node writing b2, one
\* crash (process or power loss). Expected: no violation.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2", "w3", "w4"}
    Kind <- KindS1
    Target <- TargetS1
    Land <- LandS1
    Init0 <- InitS1
    DBFirst = TRUE
    GuardCAS = TRUE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = TRUE
    GuardDBBeforeLocal = TRUE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
PROPERTIES
    EventuallyConsistent
