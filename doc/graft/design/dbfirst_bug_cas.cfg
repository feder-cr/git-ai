\* DB-first without the compare-and-swap in the database commit (last writer
\* wins). Expected: ExactlyOnceLand or NoLostUpdate violated.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2", "w3", "w4"}
    Kind <- KindS1
    Target <- TargetS1
    Land <- LandS1
    Init0 <- InitS1
    DBFirst = TRUE
    GuardCAS = FALSE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = TRUE
    GuardDBBeforeLocal = TRUE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
