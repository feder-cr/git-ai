\* The design on main with two nodes: a push on b1 while another node writes
\* b1. Expected: NoPhantom violated: the open bug of rejected updates of
\* non-atomic pushes, beyond the stale create that 02fbb52 refuses.
SPECIFICATION Spec
CONSTANTS
    Branches = {"b1", "b2"}
    Writers = {"w1", "w2"}
    Kind <- KindS4
    Target <- TargetS4
    Land <- LandS4
    Init0 <- InitS4
    DBFirst = FALSE
    GuardCAS = TRUE
    GuardNeverRevert = TRUE
    GuardStaleCreate = TRUE
    GuardStaleUpdate = FALSE
    GuardDBBeforeLocal = TRUE
    MaxCrashes = 1
INVARIANTS
    TypeOK
    LogDense
    LocalNotAhead
    WatermarkTruthful
    AckedDurable
    NoLostUpdate
    NoPhantom
    ExactlyOnceLand
    ReadYourWrites
